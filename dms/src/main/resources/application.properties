spring.application.name=dms

# Database -- DB_URL / DB_USERNAME / DB_PASSWORD are supplied as container
# environment variables (see docker-compose.yml). This file just maps the
# standard Spring Boot datasource keys onto them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail -- optional, only needed for password-reset emails (MailService).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Used to build links inside password-reset emails (AuthService).
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}

# Swagger / OpenAPI docs are only ever served when the local/dev profile is
# active (see SwaggerConfig, @Profile({"local","dev"})); these two keys are
# the belt-and-suspenders override so they stay off by default too.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# File uploads (product images, payment proofs, company logo).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Bug fix: this used to be a bare relative "uploads" folder (FileUploadUtil /
# WebConfig both did Paths.get("uploads")), which resolves against whatever
# directory the JVM happens to be started from. Every time this project gets
# re-extracted into a new folder (a new zip download, a rename, moving it),
# that "current directory" changes, so every previously uploaded file
# (payment proofs, product images, the company logo) is left behind in the
# OLD folder and every existing DB row pointing at it 404s — the app looks
# in the new, empty uploads/ folder and finds nothing. Pinning this to a
# fixed, absolute location outside the project folder means uploads survive
# every future re-extraction/move. Override with the UPLOAD_DIR environment
# variable if you ever want it somewhere else (e.g. a server deployment).
app.upload-dir=${UPLOAD_DIR:${user.home}/brisk-dms-uploads}

server.port=8080
