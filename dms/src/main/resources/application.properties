spring.application.name=dms

# Database -- DB_URL / DB_USERNAME / DB_PASSWORD are supplied as container
# environment variables (see docker-compose.yml). This file just maps the
# standard Spring Boot datasource keys onto them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail -- optional, only needed for password-reset emails (MailService).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Used to build links inside password-reset emails (AuthService).
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}

# Swagger / OpenAPI docs are only ever served when the local/dev profile is
# active (see SwaggerConfig, @Profile({"local","dev"})); these two keys are
# the belt-and-suspenders override so they stay off by default too.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# File uploads (product images, payment proofs, company logo).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080
